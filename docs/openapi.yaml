        updated_at: { $ref: '#/components/schemas/DateTime' }
    ProductInput:
      type: object
      properties:
        brand_id: { $ref: '#/components/schemas/Id' }
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'] }
