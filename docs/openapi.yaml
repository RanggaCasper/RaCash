          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/NotificationLog' } }

  # ==========================================================================
  # SISTEM
  # ==========================================================================
  /healthz:
    get:
      tags: [System]
      operationId: healthz
      responses:
        '200': { description: Proses hidup }
  /readyz:
    get:
      tags: [System]
      operationId: readyz
      responses:
        '200': { description: PostgreSQL & Redis siap }
        '503': { description: Dependensi belum siap }
  /metrics:
    get:
      tags: [System]
      operationId: metrics
      description: Prometheus. Hanya dilayani di port internal METRICS_ADDR (default :9090), tidak di host API publik.
      responses:
        '200':
          description: OK
          content:
            text/plain: { schema: { type: string } }

# ============================================================================
# CALLBACK KELUAR KE RESELLER
# ============================================================================
webhooks:
  resellerOrderCallback:
    post:
      summary: Callback status order ke `callback_url` reseller
      description: |
        Dikirim saat order mencapai `SUCCESS`, `FAILED`, atau `REFUNDED`. `X-Signature` dihitung
        seperti H2H, memakai **callback secret** reseller; path = path dari `callback_url`.
        Reseller wajib membalas 2xx dalam 10 detik. Retry: 1m, 5m, 15m, 1j, 6j (maks. 5 kali);
        reseller harus idempoten berdasarkan `event_id`.
      parameters:
        - { name: X-Timestamp, in: header, required: true, schema: { type: integer } }
        - { name: X-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Event-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResellerCallbackPayload' }
      responses:
        '200': { description: Diterima oleh reseller }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token 15 menit. Claim: sub, sid, pv (perm_version), iat, exp.'
    h2hApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    h2hTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Unix epoch detik; toleransi ±300 detik
    h2hSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        hex(HMAC_SHA256(secret, METHOD + "\n" + PATH_WITH_QUERY + "\n" + X-Timestamp + "\n" + hex(SHA256(body))))

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    InvoiceNo:
      name: invoice_no
      in: path
      required: true
      schema: { $ref: '#/components/schemas/InvoiceNo' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: Nama field; awalan `-` untuk menurun, mis. `-created_at`
      schema: { type: string }
    Q:
      name: q
      in: query
      schema: { type: string }
    From:
      name: from
      in: query
      description: Inklusif
      schema: { $ref: '#/components/schemas/DateTime' }
    To:
      name: to
      in: query
      description: Eksklusif
      schema: { $ref: '#/components/schemas/DateTime' }
    ExportFormat:
      name: format
      in: query
      required: true
      schema: { type: string, enum: [csv, xlsx] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; disimpan 24 jam. Body berbeda dengan key sama → `409 IDEMPOTENCY_CONFLICT`.
      schema: { type: string, format: uuid }
    CaptchaToken:
      name: X-Captcha-Token
      in: header
      required: false
      description: Wajib untuk guest di checkout & endpoint auth publik
      schema: { type: string }
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      description: Dari `POST /auth/step-up`; berlaku 5 menit. Tanpa token → `403 STEP_UP_REQUIRED`.
      schema: { type: string }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { type: 'null' }
    Accepted:
      description: Diterima, diproses asinkron
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string }
    AdminOrder:
      description: Order terbaru setelah aksi
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminOrderDetail' }
    FileExport:
      description: File export
      content:
        text/csv: { schema: { type: string, format: binary } }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
    BadRequest:
      description: '`BAD_REQUEST`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthenticated:
      description: '`UNAUTHENTICATED`, `TOKEN_EXPIRED`, `INVALID_CREDENTIALS`, `INVALID_SIGNATURE`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: '`PERMISSION_DENIED`, `STEP_UP_REQUIRED`, `ACCOUNT_SUSPENDED`, `EMAIL_NOT_VERIFIED`, `IP_NOT_ALLOWED`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: '`NOT_FOUND` — tidak ada atau bukan milik pemanggil'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: '`CONFLICT`, `INVALID_STATE_TRANSITION`, `IDEMPOTENCY_CONFLICT`, `VERSION_CONFLICT`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unprocessable:
      description: '`VALIDATION_ERROR`, `PRODUCT_UNAVAILABLE`, `PAYMENT_METHOD_UNAVAILABLE`, `PROMO_INVALID`, `INSUFFICIENT_BALANCE`, `ACCOUNT_NOT_FOUND`, `PRICE_CHANGED`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: '`RATE_LIMITED`; lihat header `Retry-After`'
      headers:
        Retry-After: { schema: { type: integer } }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: '`SERVICE_UNAVAILABLE`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UpstreamError:
      description: '`UPSTREAM_ERROR` — provider/PG gagal merespons'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    # ---------------------------------------------------------------- dasar
    Id: { type: string, format: uuid, description: UUID v7 }
    DateTime: { type: string, format: date-time, description: RFC 3339 UTC }
    Money: { type: integer, format: int64, description: Rupiah bulat }
    InvoiceNo: { type: string, pattern: '^RC-\d{8}-[A-Z0-9]{6}$', example: RC-20261010-7F3K9Q }
    Password: { type: string, minLength: 8, description: Minimal 8 karakter, mengandung huruf dan angka }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }

    Envelope:
      type: object
      required: [success, request_id]
      properties:
        success: { type: boolean, const: true }
        request_id: { type: string, example: req_01JA7Z8Q2N4K }
    PagedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [meta]
          properties:
            meta: { $ref: '#/components/schemas/PageMeta' }
    PageMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    ErrorEnvelope:
      type: object
      required: [success, error, request_id]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Bahasa sesuai Accept-Language, aman ditampilkan }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
                  required_permission: { type: string }
        request_id: { type: string }
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - INVALID_CREDENTIALS
        - INVALID_SIGNATURE
        - PERMISSION_DENIED
        - STEP_UP_REQUIRED
        - ACCOUNT_SUSPENDED
        - EMAIL_NOT_VERIFIED
        - IP_NOT_ALLOWED
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - VERSION_CONFLICT
        - VALIDATION_ERROR
        - PRODUCT_UNAVAILABLE
        - PAYMENT_METHOD_UNAVAILABLE
        - PROMO_INVALID
        - INSUFFICIENT_BALANCE
        - ACCOUNT_NOT_FOUND
        - PRICE_CHANGED
        - RATE_LIMITED
        - UPSTREAM_ERROR
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR

    # ---------------------------------------------------------------- enum
    OrderStatus: { type: string, enum: [PENDING_PAYMENT, PAID, PROCESSING, SUCCESS, FAILED, REFUNDED, EXPIRED] }
    PaymentStatus: { type: string, enum: [PENDING, PAID, EXPIRED, FAILED, REFUNDED] }
    PaymentPurpose: { type: string, enum: [ORDER, DEPOSIT] }
    PaymentMethodGroup: { type: string, enum: [QRIS, VIRTUAL_ACCOUNT, EWALLET, RETAIL, BALANCE] }
    FeeBearer: { type: string, enum: [CUSTOMER, MERCHANT, SPLIT] }
    AttemptStatus: { type: string, enum: [SUCCESS, PENDING, FAILED] }
    LedgerType: { type: string, enum: [DEPOSIT, PURCHASE, REFUND, ADJUSTMENT] }
    DepositStatus: { type: string, enum: [PENDING, PAID, EXPIRED, FAILED] }
    UserStatus: { type: string, enum: [ACTIVE, SUSPENDED, PENDING_VERIFICATION] }
    RoleScope: { type: string, enum: [internal, customer] }
    RoutingStrategy: { type: string, enum: [cheapest, priority, weighted] }
    VendorMode: { type: string, enum: [sandbox, production] }
    AmountType: { type: string, enum: [FLAT, PERCENT] }
    PricingScope: { type: string, enum: [global, category, brand, product] }
    CircuitState: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
    RefundDestination: { type: string, enum: [BALANCE, SOURCE, MANUAL], default: BALANCE }
    InputFieldType: { type: string, enum: [text, number, phone, select] }
    InstructionType: { type: string, enum: [QR, VA, REDIRECT, CODE] }
    NotificationChannel: { type: string, enum: [EMAIL, WHATSAPP] }
    DeliveryStatus: { type: string, enum: [QUEUED, SENT, FAILED] }
    ReconciliationTarget: { type: string, enum: [PROVIDER, PAYMENT_GATEWAY] }
    ReconciliationStatus: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
    ReconciliationItemType: { type: string, enum: [MISSING_INTERNAL, MISSING_EXTERNAL, AMOUNT_MISMATCH, STATUS_MISMATCH] }

    # ---------------------------------------------------------------- katalog publik
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        name: { type: string }
        icon_url: { type: [string, 'null'], format: uri }
        sort_order: { type: integer }
    CategoryRef:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
    BrandSummary:
      type: object
      required: [id, slug, name, category]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/CategoryRef' }
        icon_url: { type: [string, 'null'], format: uri }
        is_popular: { type: boolean }
    BrandDetail:
      allOf:
        - $ref: '#/components/schemas/BrandSummary'
        - type: object
          properties:
            banner_url: { type: [string, 'null'], format: uri }
            description: { type: [string, 'null'] }
            supports_account_check: { type: boolean }
            input_schema: { type: array, items: { $ref: '#/components/schemas/InputField' } }
    InputField:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string, example: user_id }
        label: { type: string, example: User ID }
        type: { $ref: '#/components/schemas/InputFieldType' }
        required: { type: boolean }
        pattern: { type: [string, 'null'] }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    PublicProduct:
      type: object
      required: [id, sku, name, price, is_available]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sku: { type: string, example: MLBB-86 }
        name: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        original_price: { type: [integer, 'null'] }
        is_available: { type: boolean }
        badge: { type: [string, 'null'] }
        sort_order: { type: integer }
    Banner:
      type: object
      required: [id, title, image_url]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        image_url: { type: string, format: uri }
        link_url: { type: [string, 'null'] }
    Target:
      type: object
      description: Sesuai `input_schema` brand
      additionalProperties: { type: string }
      example: { user_id: '12345678', zone_id: '2001' }
    AccountCheckRequest:
      type: object
      required: [brand_slug, target]
      properties:
        brand_slug: { type: string }
        target: { $ref: '#/components/schemas/Target' }

    # ---------------------------------------------------------------- checkout
    PublicPaymentMethod:
      type: object
      required: [code, name, group, fee, total, is_available]
      properties:
        code: { type: string, example: QRIS }
        name: { type: string }
        group: { $ref: '#/components/schemas/PaymentMethodGroup' }
        icon_url: { type: [string, 'null'], format: uri }
        fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        min_amount: { $ref: '#/components/schemas/Money' }
        max_amount: { type: [integer, 'null'] }
        is_available: { type: boolean }
        unavailable_reason:
          type: [string, 'null']
          enum: [LOGIN_REQUIRED, INSUFFICIENT_BALANCE, OUT_OF_RANGE, MAINTENANCE, null]
    QuoteRequest:
      type: object
      required: [product_id, payment_method]
      properties:
        product_id: { $ref: '#/components/schemas/Id' }
        payment_method: { type: string }
        promo_code: { type: [string, 'null'] }
    Quote:
      type: object
      required: [product, discount, fee, total, quote_token, quote_expires_at]
      properties:
        product:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            price: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        promo:
          type: [object, 'null']
          properties:
            code: { type: string }
            applied: { type: boolean }
            message: { type: string }
        quote_token: { type: string }
        quote_expires_at: { $ref: '#/components/schemas/DateTime' }
    CreateOrderRequest:
      type: object
      required: [product_id, target, payment_method]
      properties:
        product_id: { $ref: '#/components/schemas/Id' }
        target: { $ref: '#/components/schemas/Target' }
        payment_method: { type: string }
        promo_code: { type: [string, 'null'] }
        quote_token: { type: [string, 'null'] }
        contact:
          type: object
          description: Guest wajib mengisi minimal satu
          properties:
            email: { type: [string, 'null'], format: email }
            whatsapp: { type: [string, 'null'] }
    OrderAmount:
      type: object
      required: [price, discount, fee, total]
      properties:
        price: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    ProductRef:
      type: object
      properties:
        brand: { type: string }
        name: { type: string }
    PaymentInstructions:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/InstructionType' }
        qr_string: { type: [string, 'null'] }
        qr_image_url: { type: [string, 'null'] }
        va_number: { type: [string, 'null'] }
        payment_code: { type: [string, 'null'] }
        checkout_url: { type: [string, 'null'] }
        steps: { type: array, items: { type: string } }
    CheckoutPayment:
      type: object
      required: [method, status, expires_at]
      properties:
        method: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        instructions: { $ref: '#/components/schemas/PaymentInstructions' }
        expires_at: { $ref: '#/components/schemas/DateTime' }
    CheckoutOrder:
      type: object
      required: [invoice_no, status, product, target_display, amount, payment, created_at, tracking_url]
      properties:
        invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        product: { $ref: '#/components/schemas/ProductRef' }
        target_display: { type: string }
        amount: { $ref: '#/components/schemas/OrderAmount' }
        payment: { $ref: '#/components/schemas/CheckoutPayment' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        tracking_url: { type: string, format: uri }
    TimelineEntry:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { $ref: '#/components/schemas/DateTime' }
        actor: { type: string, description: 'system, user, admin, provider, gateway (admin saja)' }
    PublicOrder:
      type: object
      required: [invoice_no, status, product, target_display, amount, payment, timeline]
      properties:
        invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        product: { $ref: '#/components/schemas/ProductRef' }
        target_display: { type: string }
        amount: { $ref: '#/components/schemas/OrderAmount' }
        payment:
          type: object
          properties:
            method: { type: string }
            status: { $ref: '#/components/schemas/PaymentStatus' }
            paid_at: { type: [string, 'null'], format: date-time }
        delivery:
          type: [object, 'null']
          properties:
            serial_number: { type: [string, 'null'] }
            message: { type: [string, 'null'] }
        timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
    OrderListItem:
      type: object
      required: [invoice_no, status, product, total, created_at]
      properties:
        invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        product: { $ref: '#/components/schemas/ProductRef' }
        target_display: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        payment_method: { type: string }
        created_at: { $ref: '#/components/schemas/DateTime' }

    # ---------------------------------------------------------------- auth & member
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: [string, 'null'], maxLength: 20 }
        password: { $ref: '#/components/schemas/Password' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthUser:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string, format: email }
        tier: { type: string, example: MEMBER }
        roles: { type: array, items: { type: string } }
    LoginResult:
      type: object
      required: [two_factor_required]
      properties:
        two_factor_required: { type: boolean }
        two_factor_setup_required: { type: boolean, description: User internal wajib setup 2FA dulu }
        challenge_token: { type: string, description: Ada bila two_factor_required = true }
        challenge_expires_at: { $ref: '#/components/schemas/DateTime' }
        access_token: { type: string }
        access_token_expires_at: { $ref: '#/components/schemas/DateTime' }
        refresh_token: { type: string }
        refresh_token_expires_at: { $ref: '#/components/schemas/DateTime' }
        user: { $ref: '#/components/schemas/AuthUser' }
    TierRef:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
    Me:
      type: object
      required: [id, name, email, tier, balance, status, two_factor_enabled, roles]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        tier: { $ref: '#/components/schemas/TierRef' }
        balance: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/UserStatus' }
        two_factor_enabled: { type: boolean }
        email_verified_at: { type: [string, 'null'], format: date-time }
        roles: { type: array, items: { type: string } }
    MyPermissions:
      type: object
      required: [roles, permissions, perm_version]
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
        permissions: { type: array, items: { type: string }, example: [dashboard:view, orders:read] }
        perm_version: { type: integer }
    TwoFactorStatus:
      type: object
      required: [enabled, required, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        required: { type: boolean, description: Benar untuk user ber-role internal }
        recovery_codes_remaining: { type: integer }
    TwoFactorSetup:
      type: object
      required: [otpauth_url, secret]
      properties:
        otpauth_url: { type: string, description: URI otpauth:// untuk QR code }
        secret: { type: string, description: Secret base32 untuk input manual }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, items: { type: string } }
    StepUpResult:
      type: object
      required: [step_up_token, expires_at]
      properties:
        step_up_token: { type: string }
        expires_at: { $ref: '#/components/schemas/DateTime' }
    Session:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
