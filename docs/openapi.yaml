      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string, enum: [GUEST, MEMBER, RESELLER_SILVER, RESELLER_GOLD, RESELLER_PLATINUM] }
        name: { type: string }
        rank: { type: integer }
        is_default: { type: boolean }
        auto_upgrade_min_volume: { type: [integer, 'null'] }
    Promo:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/AmountType' }
        value: { type: number }
        max_discount: { type: [integer, 'null'] }
        min_transaction: { $ref: '#/components/schemas/Money' }
        quota: { type: [integer, 'null'] }
        used_count: { type: integer, readOnly: true }
        per_user_limit: { type: [integer, 'null'] }
