        balance_checked_at: { type: [string, 'null'], format: date-time }
        circuit_state: { $ref: '#/components/schemas/CircuitState' }
        success_rate_24h: { type: [number, 'null'] }
        credentials_configured: { type: boolean }
        config: { type: object }
