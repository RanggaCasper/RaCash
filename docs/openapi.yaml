openapi: 3.1.0
info:
  title: RaCash API
  version: 0.6.0
  summary: Website top-up multi provider & multi payment gateway
  description: |
    Dihasilkan dari `API_CONTRACT.md` v0.6. Bila berbeda, `API_CONTRACT.md` yang berlaku
    dan file ini wajib diperbarui.

    Konvensi:
    - Semua respons JSON memakai envelope `{ success, data, meta?, request_id }` (kecuali webhook & export file).
    - Field `snake_case`; uang `integer` rupiah; waktu RFC 3339 UTC; ID UUID v7.
    - Ekstensi vendor:
      - `x-permission`: permission RBAC yang wajib dimiliki.
      - `x-sensitive: true`: butuh header `X-Step-Up-Token` (★).
      - `x-idempotent: true`: wajib header `Idempotency-Key` (🔁).
servers:
  - url: https://api.{domain}
    variables:
      domain:
        default: racash.id
tags:
  - name: Public
  - name: Auth
  - name: Member
  - name: Reseller
  - name: H2H
  - name: Webhook
  - name: Admin Dashboard
  - name: Admin Catalog
  - name: Admin Media
  - name: Admin Pricing
  - name: Admin Provider
  - name: Admin Payment
  - name: Admin Order
  - name: Admin User
  - name: Admin RBAC
  - name: Admin Audit & Settings
  - name: System

paths:
  # ==========================================================================
  # PUBLIK
  # ==========================================================================
  /api/v1/categories:
    get:
      tags: [Public]
      operationId: listCategories
      summary: Daftar kategori aktif
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/brands:
    get:
      tags: [Public]
      operationId: listBrands
      summary: Daftar brand
      parameters:
        - { name: category, in: query, schema: { type: string }, description: Slug kategori }
        - $ref: '#/components/parameters/Q'
        - { name: popular, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/BrandSummary' } }

  /api/v1/brands/{slug}:
    get:
      tags: [Public]
      operationId: getBrand
      summary: Detail brand + skema form input
      parameters: [ { $ref: '#/components/parameters/Slug' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BrandDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/brands/{slug}/products:
    get:
      tags: [Public]
      operationId: listBrandProducts
      summary: Produk aktif + harga sesuai tier pemanggil (guest bila tanpa token)
      security: [ {}, { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Slug' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PublicProduct' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounts/check:
    post:
      tags: [Public]
      operationId: checkAccount
      summary: Cek nickname akun game
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCheckRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [nickname]
                        properties:
                          nickname: { type: string, example: Pl***er01 }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /api/v1/payment-methods:
    get:
      tags: [Public]
      operationId: listPaymentMethods
      summary: Metode bayar yang tersedia untuk nominal tertentu
      security: [ {}, { bearerAuth: [] } ]
      parameters:
        - { name: amount, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PublicPaymentMethod' } }

  /api/v1/orders/quote:
    post:
      tags: [Public]
      operationId: quoteOrder
      summary: Hitung total tanpa membuat order; quote_token mengunci harga 10 menit
      security: [ {}, { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Quote' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/orders:
    post:
      tags: [Public]
      operationId: createOrder
      summary: Checkout / buat invoice
      description: |
        - `contact.email` atau `contact.whatsapp` wajib minimal satu untuk guest.
        - `payment_method = BALANCE` hanya untuk user login; order langsung `PAID`.
        - `payment.expires_at` = waktu buat + `expiry_minutes` metode bayar; PG menolak pembayaran setelahnya.
      x-idempotent: true
      security: [ {}, { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaptchaToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Invoice dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CheckoutOrder' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /api/v1/orders/{invoice_no}:
    get:
      tags: [Public]
      operationId: trackOrder
      summary: Lacak status order (data pribadi tersamar)
      parameters:
        - $ref: '#/components/parameters/InvoiceNo'
        - name: contact
          in: query
          description: Email/no WA saat checkout; bila cocok, `delivery.serial_number` tidak disamarkan
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicOrder' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/banners:
    get:
      tags: [Public]
      operationId: listBanners
      summary: Banner beranda
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Banner' } }

  # ==========================================================================
  # AUTH
  # ==========================================================================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      parameters: [ { $ref: '#/components/parameters/CaptchaToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Terdaftar, menunggu verifikasi email
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user_id, status]
                        properties:
                          user_id: { $ref: '#/components/schemas/Id' }
                          status: { $ref: '#/components/schemas/UserStatus' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      parameters: [ { $ref: '#/components/parameters/CaptchaToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: |
        - `403 EMAIL_NOT_VERIFIED` bila email belum diverifikasi.
        - `two_factor_required: true` → lanjut ke `/auth/login/2fa`.
        - `two_factor_setup_required: true` → user internal belum mengaktifkan 2FA; token hanya bisa mengakses `/auth/2fa/*`.
        - `422 VALIDATION_ERROR` bila captcha kosong/ditolak (`details[].field = X-Captcha-Token`).
      parameters: [ { $ref: '#/components/parameters/CaptchaToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/login/2fa:
    post:
      tags: [Auth]
      operationId: login2fa
      description: |
        Challenge berlaku 5 menit, sekali pakai, hangus setelah 5 kode salah.
        Kode salah → `401 INVALID_CREDENTIALS`; challenge tidak ada/kedaluwarsa → `401 UNAUTHENTICATED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: Kode TOTP 6 digit atau recovery code }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      description: Refresh token dirotasi; pemakaian ulang token lama mencabut sesi pemilik token itu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      parameters: [ { $ref: '#/components/parameters/CaptchaToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/auth/2fa/status:
    get:
      tags: [Auth]
      operationId: get2faStatus
      description: Boleh dipanggil dengan token terbatas (`two_factor_setup_required`).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Status 2FA
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TwoFactorStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/auth/2fa/setup:
    post:
      tags: [Auth]
      operationId: setup2fa
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Secret TOTP dibuat (belum aktif)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TwoFactorSetup' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/2fa/enable:
    post:
      tags: [Auth]
      operationId: enable2fa
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
      responses:
        '200':
          description: 2FA aktif; recovery codes hanya ditampilkan sekali
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecoveryCodes' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/2fa/disable:
    post:
      tags: [Auth]
      operationId: disable2fa
      x-sensitive: true
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/StepUpToken' } ]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/auth/step-up:
    post:
      tags: [Auth]
      operationId: stepUp
      description: Hanya kode TOTP (recovery code ditolak). Token terikat ke user dan sesi pembuatnya.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
      responses:
        '200':
          description: Step-up token (berlaku 5 menit)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StepUpResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  # MEMBER
  # ==========================================================================
  /api/v1/me:
    get:
      tags: [Member]
      operationId: getMe
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Member]
      operationId: updateMe
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/me/password:
    put:
      tags: [Member]
      operationId: changePassword
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/me/permissions:
    get:
      tags: [Member]
      operationId: getMyPermissions
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Permission efektif; super_admin berisi `["*"]`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyPermissions' }

  /api/v1/me/sessions:
    get:
      tags: [Member]
      operationId: listMySessions
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Session' } }

  /api/v1/me/sessions/{id}:
    delete:
      tags: [Member]
      operationId: revokeMySession
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/orders:
    get:
      tags: [Member]
      operationId: listMyOrders
      x-permission: self:orders
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: status, in: query, schema: { type: string }, description: 'Satu/lebih `OrderStatus`, dipisah koma' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/OrderListItem' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/me/orders/{invoice_no}:
    get:
      tags: [Member]
      operationId: getMyOrder
      x-permission: self:orders
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/InvoiceNo' } ]
      responses:
        '200':
          description: Detail lengkap (SN tidak disamarkan)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicOrder' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/ledger:
    get:
      tags: [Member]
      operationId: listMyLedger
      x-permission: self:balance
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/LedgerType' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }

  /api/v1/me/deposits:
    post:
      tags: [Member]
      operationId: createDeposit
      summary: Buat deposit saldo (minimal `settings.min_deposit`, default Rp10.000)
      x-permission: self:deposit
      x-idempotent: true
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payment_method]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                payment_method: { type: string, example: VA_BCA }
      responses:
        '201':
          description: Deposit dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Deposit' }
        '409': { $ref: '#/components/responses/Conflict' }
