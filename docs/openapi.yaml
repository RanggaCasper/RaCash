    BrandInput:
      type: object
      properties:
        category_id: { $ref: '#/components/schemas/Id' }
        slug: { type: string, pattern: '^[a-z0-9-]{2,100}$' }
        name: { type: string, maxLength: 120 }
        icon_media_id: { type: [string, 'null'], format: uuid }
        banner_media_id: { type: [string, 'null'], format: uuid }
        description: { type: [string, 'null'] }
        input_schema: { type: array, items: { $ref: '#/components/schemas/InputField' } }
        supports_account_check: { type: boolean }
        is_popular: { type: boolean }
        sort_order: { type: integer }
        is_active: { type: boolean }
        seo_title: { type: [string, 'null'], maxLength: 160 }
        seo_description: { type: [string, 'null'], maxLength: 320 }
    AdminProduct:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
