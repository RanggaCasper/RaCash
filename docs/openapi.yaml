        description: { type: string }
        reason: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/DateTime' }
    Deposit:
      type: object
      required: [id, amount, status, payment, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/DepositStatus' }
        payment: { $ref: '#/components/schemas/CheckoutPayment' }
        created_at: { $ref: '#/components/schemas/DateTime' }
