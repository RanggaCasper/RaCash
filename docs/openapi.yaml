    H2hProduct:
      type: object
      required: [sku, name, price, is_available]
      properties:
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        category: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        is_available: { type: boolean }
        input_schema: { type: array, items: { $ref: '#/components/schemas/InputField' } }
    H2hOrderRequest:
      type: object
      required: [ref_id, sku, target]
      properties:
        ref_id: { type: string, maxLength: 64, description: Unik per reseller; kunci idempotensi }
        sku: { type: string }
        target: { $ref: '#/components/schemas/Target' }
        max_price: { type: [integer, 'null'] }
    H2hOrder:
      type: object
      required: [ref_id, invoice_no, status, price, created_at]
      properties:
        ref_id: { type: string }
        invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        price: { $ref: '#/components/schemas/Money' }
        balance_after: { $ref: '#/components/schemas/Money' }
        serial_number: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/DateTime' }
    ResellerCallbackPayload:
      type: object
      required: [event, event_id, data]
      properties:
        event: { type: string, enum: [order.succeeded, order.failed, order.refunded] }
        event_id: { type: string }
        data:
          type: object
          properties:
            ref_id: { type: string }
            invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
            status: { $ref: '#/components/schemas/OrderStatus' }
            sku: { type: string }
            price: { $ref: '#/components/schemas/Money' }
            serial_number: { type: [string, 'null'] }
            message: { type: [string, 'null'] }
