        mappings:
          type: array
          items:
            type: object
            required: [provider_id, provider_sku]
            properties:
              provider_id: { $ref: '#/components/schemas/Id' }
              provider_sku: { type: string, maxLength: 100 }
              weight: { type: [integer, 'null'] }
              is_active: { type: boolean, default: true }
