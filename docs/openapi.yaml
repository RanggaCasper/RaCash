        is_active: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    PricingRuleInput:
      type: object
      required: [scope, margin_type, margin_value]
      properties:
        scope: { $ref: '#/components/schemas/PricingScope' }
        scope_id: { type: [string, 'null'], format: uuid, description: Wajib kecuali scope = global }
        tier_id: { type: [string, 'null'], format: uuid }
        margin_type: { $ref: '#/components/schemas/AmountType' }
        margin_value: { type: number, minimum: 0 }
        min_margin: { type: integer, minimum: 0, default: 0 }
        is_active: { type: boolean, default: true }
