        name: { type: string }
        mode: { $ref: '#/components/schemas/VendorMode' }
        is_active: { type: boolean }
        circuit_state: { $ref: '#/components/schemas/CircuitState' }
        credentials_configured: { type: boolean }
        config: { type: object }
    PaymentGatewayInput:
      type: object
      properties:
        code: { type: string, description: Hanya saat create }
        name: { type: string }
        mode: { $ref: '#/components/schemas/VendorMode' }
        is_active: { type: boolean }
        config: { type: object }
