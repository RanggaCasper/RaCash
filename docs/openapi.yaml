      operationId: h2hListProducts
      security: [ { h2hApiKey: [], h2hTimestamp: [], h2hSignature: [] } ]
      parameters:
        - { name: brand, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/H2hProduct' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/h2h/v1/balance:
    get:
      tags: [H2H]
      operationId: h2hGetBalance
      security: [ { h2hApiKey: [], h2hTimestamp: [], h2hSignature: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [balance]
                        properties:
                          balance: { $ref: '#/components/schemas/Money' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/h2h/v1/orders:
    post:
      tags: [H2H]
      operationId: h2hCreateOrder
      description: |
        Dibayar dari saldo. `ref_id` unik per reseller dan menjadi kunci idempotensi
        (`Idempotency-Key` opsional). `max_price` lebih rendah dari harga saat ini → `422 PRICE_CHANGED`.
      x-idempotent: true
      security: [ { h2hApiKey: [], h2hTimestamp: [], h2hSignature: [] } ]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/H2hOrderRequest' }
      responses:
        '202':
          description: Diterima & sedang diproses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/H2hOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/h2h/v1/orders/{ref_id}:
    get:
      tags: [H2H]
      operationId: h2hGetOrder
      security: [ { h2hApiKey: [], h2hTimestamp: [], h2hSignature: [] } ]
      parameters:
        - { name: ref_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/H2hOrder' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # WEBHOOK MASUK (format vendor, tanpa envelope)
  # ==========================================================================
  /api/v1/webhooks/payments/{gateway_code}:
    post:
      tags: [Webhook]
      operationId: paymentWebhook
      description: |
        Format body & balasan mengikuti vendor (adapter `WebhookAck`). Idempoten per
        `source + event_id`. Nominal ≥ `settings.payment_recheck_threshold` dikonfirmasi ulang via
        `CheckStatus`. `PAID` untuk order/deposit yang sudah `EXPIRED` tidak diproses (alert admin).
      parameters:
        - { name: gateway_code, in: path, required: true, schema: { type: string, example: xendit } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Diterima (format balasan sesuai vendor) }
        '401': { description: Signature tidak valid }

  /api/v1/webhooks/providers/{provider_code}:
    post:
      tags: [Webhook]
      operationId: providerWebhook
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string, example: digiflazz } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Diterima (format balasan sesuai vendor) }
        '401': { description: Signature tidak valid }

