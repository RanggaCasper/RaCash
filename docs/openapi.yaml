        value: { type: number, minimum: 0 }
        max_discount: { type: [integer, 'null'] }
        min_transaction: { type: integer, minimum: 0 }
        quota: { type: [integer, 'null'] }
        per_user_limit: { type: [integer, 'null'] }
        rules: { type: object }
        starts_at: { $ref: '#/components/schemas/DateTime' }
        ends_at: { $ref: '#/components/schemas/DateTime' }
        is_active: { type: boolean }

