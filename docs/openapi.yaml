      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        scope: { $ref: '#/components/schemas/PricingScope' }
        scope_id: { type: [string, 'null'], format: uuid }
        tier_id: { type: [string, 'null'], format: uuid, description: null = semua tier }
        margin_type: { $ref: '#/components/schemas/AmountType' }
        margin_value: { type: number, description: Rupiah bila FLAT, persen bila PERCENT }
