          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Id' }
            scope: { $ref: '#/components/schemas/PricingScope' }
        loss_protected: { type: boolean, description: true bila PRC-05 akan menolak transaksi }
