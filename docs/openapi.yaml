      type: object
      required: [credentials]
      properties:
        credentials:
          type: object
          additionalProperties: { type: string }
          description: Isi bergantung adapter; disimpan terenkripsi
    ConnectionTestResult:
      type: object
      properties:
        ok: { type: boolean }
