      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        attempt_no: { type: integer }
        provider: { type: string }
        provider_sku: { type: string }
        ref_id: { type: string, example: RC-20261010-7F3K9Q-1 }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        cost_price: { $ref: '#/components/schemas/Money' }
        error_code: { type: [string, 'null'] }
        vendor_error_code: { type: [string, 'null'] }
        vendor_message: { type: [string, 'null'] }
        is_retryable: { type: [boolean, 'null'] }
        latency_ms: { type: [integer, 'null'] }
        triggered_by: { type: [string, 'null'], format: uuid }
        created_at: { $ref: '#/components/schemas/DateTime' }
    OrderAttemptDetail:
      allOf:
        - $ref: '#/components/schemas/OrderAttempt'
        - type: object
          properties:
            request_payload: { type: [object, 'null'] }
            response_payload: { type: [object, 'null'] }
    AdminOrderDetail:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
        source: { type: string, enum: [WEB, H2H] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer }
        user: { $ref: '#/components/schemas/OrderUserRef' }
        contact:
          type: object
          description: Disamarkan tanpa customers:view_pii
          properties:
            email: { type: [string, 'null'] }
            whatsapp: { type: [string, 'null'] }
        product:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Id' }
            sku: { type: string }
            name: { type: string }
            brand: { type: string }
        target: { $ref: '#/components/schemas/Target' }
        amount:
          allOf:
            - $ref: '#/components/schemas/OrderAmount'
            - type: object
              properties:
                cost: { type: [integer, 'null'] }
                margin: { type: [integer, 'null'] }
        payment:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Id' }
            gateway: { type: [string, 'null'] }
            method: { type: string }
            status: { $ref: '#/components/schemas/PaymentStatus' }
            external_id: { type: [string, 'null'] }
            expires_at: { type: [string, 'null'], format: date-time }
            paid_at: { type: [string, 'null'], format: date-time }
        delivery:
          type: [object, 'null']
          properties:
            serial_number: { type: [string, 'null'] }
            message: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
        refund_destination:
          oneOf:
            - $ref: '#/components/schemas/RefundDestination'
            - type: 'null'
        attempts: { type: array, items: { $ref: '#/components/schemas/OrderAttempt' } }
        available_actions:
          type: array
          items: { type: string, enum: [retry, switch-provider, mark, refund, resend-notification] }
        timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        created_at: { $ref: '#/components/schemas/DateTime' }

    # ---------------------------------------------------------------- admin: user & rbac
    AdminUser:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string, description: Disamarkan tanpa customers:view_pii }
        phone: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/UserStatus' }
        tier: { $ref: '#/components/schemas/TierRef' }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Id' }
              code: { type: string }
              name: { type: string }
        balance: { $ref: '#/components/schemas/Money' }
        two_factor_enabled: { type: boolean }
        email_verified_at: { type: [string, 'null'], format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        suspended_reason: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/DateTime' }
    PermissionGroup:
      type: object
      properties:
        resource: { type: string, example: orders }
        label: { type: string, example: Order }
        permissions:
          type: array
          items:
            type: object
            properties:
              code: { type: string, example: orders:refund }
              description: { type: string }
              is_sensitive: { type: boolean }
    Role:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        scope: { $ref: '#/components/schemas/RoleScope' }
        is_system: { type: boolean }
        user_count: { type: integer }
    RoleDetail:
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          properties:
            permissions: { type: array, items: { type: string } }
            created_at: { $ref: '#/components/schemas/DateTime' }
            updated_at: { $ref: '#/components/schemas/DateTime' }

    # ---------------------------------------------------------------- admin: audit, setting, notifikasi
    AuditLog:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        actor:
          type: [object, 'null']
          description: null = system
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            roles: { type: array, items: { type: string } }
        action: { type: string, example: order.refund }
        entity: { type: string }
        entity_id: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/DateTime' }
    Setting:
      type: object
      properties:
        key: { type: string }
        value: { description: Nilai JSON; disamarkan bila is_secret }
        is_secret: { type: boolean }
        description: { type: [string, 'null'] }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    NotificationLog:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        recipient: { type: string, description: Disamarkan tanpa customers:view_pii }
        template: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        attempts: { type: integer }
        related_type: { type: [string, 'null'] }
        related_id: { type: [string, 'null'], format: uuid }
        provider_message_id: { type: [string, 'null'] }
        last_error: { type: [string, 'null'] }
        sent_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/DateTime' }
